<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Not Found | James Tannahill</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    @font-face { font-family: 'NHG Display'; src: url('https://fonts.jamestannahill.com/NHGDisplay-Light.woff2') format('woff2'); font-weight: 300; font-display: swap; }
    @font-face { font-family: 'NHG Display'; src: url('https://fonts.jamestannahill.com/NHGDisplay-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    /* Same tokens as the map (map/index.html :root). */
    :root { --gold: #C9A84C; --gold-dim: #8B7332; --ink: #0A0A0A; --ash: #8C8C8C; --paper: #E8E4DC; color-scheme: dark; }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--ink); color: var(--paper); font-family: 'NHG Display', 'Helvetica Neue', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100dvh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    main { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .rule { width: 40px; height: 1px; background: var(--gold-dim); }
    h1 { font-weight: 300; font-size: 40px; letter-spacing: 0.01em; line-height: 1.1; }
    p { font-size: 14px; color: var(--ash); line-height: 1.6; }
    a { display: inline-flex; align-items: center; min-height: 44px; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    @media (hover: hover) and (pointer: fine) { a:hover { text-decoration: underline; text-underline-offset: 6px; } }
  </style>
</head>
<body>
  <main>
    <div class="rule"></div>
    <h1>Page not found</h1>
    <p>Nothing lives at this address.</p>
    <a href="/">Back to the map</a>
  </main>
</body>
</html>
