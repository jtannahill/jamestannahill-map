  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Place",
    "name": "Former Plocamium Holdings office, W 57th Street",
    "description": "Pin on the former Plocamium Holdings office, W 57th Street, New York, shown on James Tannahill's map.",
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 40.7636,
      "longitude": -73.9749
    },
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "W 57th Street",

  }

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <style>
    @font-face {
      font-family: 'NHG Display';
      src: url('https://fonts.jamestannahill.com/NHGDisplay-Light.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'NHG Display';
      src: url('https://fonts.jamestannahill.com/NHGDisplay-Roman.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'NHG Display';
      src: url('https://fonts.jamestannahill.com/NHGDisplay-Medium.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'NHG Display';
      src: url('https://fonts.jamestannahill.com/NHGDisplay-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #C9A84C;
      --gold-dim: #8B7332;
      --gold-glow: rgba(201, 168, 76, 0.35);
      --ink: #0A0A0A;
      --smoke: #1A1A1A;
      --ash: #8C8C8C;
      --paper: #E8E4DC;
      --paper-dim: #B8B4AC;
      color-scheme: dark;
      --nhg: 'NHG Display', 'Neue Haas Grotesk Display Pro', 'Helvetica Neue', 'Helvetica', -apple-system, sans-serif;
    }

    body {
      background: var(--ink);
      overflow: hidden;
      height: 100dvh;
      width: 100vw;
      font-family: var(--nhg);
      color: var(--paper);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    ::selection { background: rgba(201, 168, 76, 0.35); color: var(--paper); }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1.8s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    #map.loaded { opacity: 1; }

    /* Vignette overlay */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(
        ellipse 80% 70% at 50% 50%,
        transparent 40%,
        rgba(10, 10, 10, 0.5) 100%
      );
    }

    /* Custom marker */
    .marker-container {
      cursor: pointer;
      width: 34px;
      height: 34px;
    }

    .marker-ping {
      position: absolute;
      width: 48px;
      height: 48px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--gold-glow);
      /* Three pulses once the map lands, then still: the card is the focus. */
      animation: ping 3s cubic-bezier(0, 0, 0.2, 1) 3;
      opacity: 0;
    }

    .marker-logo {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--ink);
      border: 1.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px var(--gold-glow);
      transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 160ms ease;
    }

    .marker-logo svg {
      width: 28px;
      height: 28px;
    }

    @media (hover: hover) and (pointer: fine) {
      .marker-container:hover .marker-logo {
        transform: scale(1.15);
        box-shadow: 0 0 16px var(--gold-glow);
      }
    }

    .marker-container:focus-visible { outline: none; }
    .marker-container:focus-visible .marker-logo { outline: 2px solid var(--gold); outline-offset: 4px; box-shadow: 0 0 0 4px rgba(10, 10, 10, 0.6); }
    .marker-container:active .marker-logo { transform: scale(0.97); }

    @keyframes ping {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.6; }
      75%, 100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
    }

    /* Info card */
    .card {
      position: fixed;
      bottom: calc(48px + env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      opacity: 0;
      transform: translateY(24px);
      animation: card-in 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      animation-play-state: paused;
      background: radial-gradient(ellipse 60% 80% at 50% 60%, rgba(10, 10, 10, 0.72) 0%, transparent 70%);
      padding: 32px 40px;
    }

    .card a { pointer-events: auto; }

    @keyframes card-in {
      to { opacity: 1; transform: translateY(0); }
    }

    .card-rule {
      width: 40px;
      height: 1px;
      background: var(--gold-dim);
    }

    .card-name {
      display: block;
      font-family: var(--nhg);
      font-weight: 300;
      font-size: 48px;
      letter-spacing: 0.01em;
      color: var(--paper);
      line-height: 1.1;
      text-align: center;
      text-wrap: balance;
      transition: opacity 160ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    .card-subtitle {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ash);
      margin-top: 8px;
      text-align: center;
      text-shadow: 0 0 8px rgba(10, 10, 10, 0.9);
    }

    .card-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      padding: 12px 0;
      position: relative;
      width: fit-content;
      transition: transform 160ms ease;
    }

    .card-cta::after {
      content: '';
      position: absolute;
      bottom: 8px;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-cta:focus-visible::after { transform: scaleX(1); }
    .card-cta:active { transform: scale(0.97); }
    /* Pressed state, visible on touch (iOS needs the touchstart listener in map.js). */
    .card-cta:active, .privacy-link:active, .wordmark-text:active, .popup-link:active, .card-name:active { opacity: 0.6; }

    .cta-arrow {
      display: inline-block;
      width: 18px;
      height: 1px;
      background: var(--gold);
      position: relative;
      transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .popup-arrow { width: 12px; margin-left: 6px; vertical-align: middle; }
    .popup-arrow::after { width: 5px; height: 5px; top: -2px; }

    .cta-arrow::after {
      content: '';
      position: absolute;
      right: 0;
      top: -3px;
      width: 7px;
      height: 7px;
      border-top: 1px solid var(--gold);
      border-right: 1px solid var(--gold);
      transform: rotate(45deg);
    }

    @media (hover: hover) and (pointer: fine) {
      .card-cta:hover::after { transform: scaleX(1); }
      .card-cta:hover .cta-arrow { transform: translateX(4px); }
      .wordmark-text:hover { opacity: 1; }
      .popup-link:hover { border-color: var(--gold); }
      .card-name:hover { opacity: 0.85; }
    }

    .card-name:focus-visible,
    .card-cta:focus-visible,
    .wordmark-text:focus-visible,
    .popup-link:focus-visible,
    .privacy-link:focus-visible,
    .mapboxgl-popup-close-button:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; box-shadow: 0 0 0 4px rgba(10, 10, 10, 0.6); }

    /* Coordinates display */
    .coords {
      position: fixed;
      top: calc(32px + env(safe-area-inset-top));
      right: calc(36px + env(safe-area-inset-right));
      z-index: 10;
      text-align: right;
      opacity: 0;
      animation: fade-in 1s ease 0.6s forwards;
      animation-play-state: paused;
      background: rgba(10, 10, 10, 0.75);
      padding: 10px 14px;
      border-radius: 4px;
    }

    .coords-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--ash);
      margin-bottom: 4px;
    }

    .coords-value {
      font-family: var(--nhg);
      font-weight: 400;
      font-size: 14px;
      color: #A88B3F;
      letter-spacing: 0.06em;
    }

    @keyframes fade-in {
      to { opacity: 1; }
    }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    /* Small wordmark top-left */
    .wordmark {
      position: fixed;
      top: calc(32px + env(safe-area-inset-top));
      left: calc(40px + env(safe-area-inset-left));
      z-index: 10;
      opacity: 0;
      animation: fade-in 1s ease 0.4s forwards;
      animation-play-state: paused;
    }

    .wordmark-text {
      font-family: var(--nhg);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--paper);
      opacity: 0.85;
      text-shadow: 0 0 8px rgba(10, 10, 10, 0.9);
      text-decoration: none;
      display: inline-block;
      padding: 16px;
      margin: -16px;
      transition: opacity 160ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* Popup override */
    .mapboxgl-popup-content {
      background: var(--smoke) !important;
      border: 1px solid rgba(201, 168, 76, 0.2) !important;
      border-radius: 2px !important;
      padding: 16px 20px !important;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5) !important;
    }

    .mapboxgl-popup-tip {
      border-top-color: var(--smoke) !important;
    }

    .mapboxgl-popup-close-button {
      color: var(--ash) !important;
      font-size: 18px !important;
      padding: 0 !important;
      width: 44px !important;
      height: 44px !important;
    }

    .popup-inner {
      font-family: var(--nhg);
    }

    .popup-logo {
      font-family: var(--nhg);
      font-weight: 500;
      font-size: 20px;
      color: var(--gold);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(201, 168, 76, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .popup-name {
      font-family: var(--nhg);
      font-weight: 400;
      font-size: 17px;
      color: var(--paper);
      margin-bottom: 4px;
    }

    .popup-addr {
      font-family: var(--nhg);
      font-size: 14px;
      font-weight: 300;
      color: var(--paper-dim, #B8B4AC);
      margin-bottom: 1px;
    }

    .popup-loc {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ash);
      font-weight: 300;
    }

    .popup-link {
      display: inline-block;
      margin-top: 2px;
      padding: 10px 0;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 160ms cubic-bezier(0.23, 1, 0.32, 1);
    }


    .privacy-link {
      position: absolute;
      left: 50%;
      bottom: -0.5rem;
      transform: translateX(-50%);
      padding: 12px 16px;
      font-size: 0.6875rem;
      letter-spacing: 0.08em;
      color: var(--paper);
      opacity: 0.85;
      text-shadow: 0 0 8px rgba(10, 10, 10, 0.9);
      text-decoration: none;
    }

    .map-fallback {
      display: none;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      padding: 12px 0;
    }

    body.no-map .map-fallback { display: inline-block; }

    /* Mobile */
    @media (max-width: 600px) {
      .card {
        bottom: calc(28px + env(safe-area-inset-bottom));
      }
      .card-name { font-size: 36px; }
      .card { padding: 24px 16px; }
      .wordmark { top: calc(20px + env(safe-area-inset-top)); left: calc(24px + env(safe-area-inset-left)); }
      .coords { top: calc(20px + env(safe-area-inset-top)); right: calc(24px + env(safe-area-inset-right)); }
      .coords-value { font-size: 12px; }
    }

    /* View transitions */
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: 200ms ease both ct-fade-out; }
    ::view-transition-new(root) { animation: 280ms ease both ct-fade-in; }
    @keyframes ct-fade-out { to { opacity: 0; } }
    @keyframes ct-fade-in { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .card, .coords, .wordmark { animation: none; opacity: 1; transform: none; }
      .marker-ping { animation: none; opacity: 0; }
      #map { transition: none; }
      ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .coords { background: var(--smoke); }
    }

    /* Overlays enter once the map has landed (map.js adds .is-landing after
       the fly-in, at once under reduced motion, or when the map fails). */
    body.is-landing .card, body.is-landing .wordmark, body.is-landing .coords { animation-play-state: running; }
    body:not(.is-landing) .marker-ping { animation-play-state: paused; }

    /* Touch targets follow the input, not the width. */
    @media (pointer: coarse) {
      .card-cta, .privacy-link, .popup-link, .map-fallback { min-height: 44px; display: inline-flex; align-items: center; }
      .mapboxgl-ctrl-attrib-button { width: 44px !important; height: 44px !important; background-position: center !important; }
    }

    /* Short viewports (landscape phones): a smaller card keeps the pin clear. */
    @media (max-height: 500px) {
      .card { padding: 16px 40px; gap: 12px; bottom: calc(16px + env(safe-area-inset-bottom)); }
      .card-name { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="vignette"></div>

  <header class="wordmark">
    <a href="https://www.jamestannahill.com" class="wordmark-text" aria-label="JT, James Tannahill home">JT</a>
  </header>

  <aside class="coords" aria-label="Location">
    <div class="coords-label">Location</div>
    <div class="coords-value">40.764&deg;N &middot; 73.975&deg;W</div>
  </aside>

  <main class="card">
    <div class="card-rule"></div>
    <div>
      <h1 style="font:inherit;margin:0"><a href="https://contact.jamestannahill.com" class="card-name" style="text-decoration:none;color:var(--paper);">James Tannahill</a></h1>
      <div class="card-subtitle">W 57th St &middot; New York</div>
      <p class="sr-only">The map is pinned on the former Plocamium Holdings office, W 57th Street, New York.</p>
    </div>
    <a href="https://maps.app.goo.gl/XjUupgjudiNXR4S2A" class="map-fallback">Open in Google Maps</a>
    <noscript><style>.map-fallback { display: inline-block; } .card, .wordmark, .coords { animation-play-state: running; }</style></noscript>
    <a href="https://www.jamestannahill.com" class="card-cta">
      Visit site <span class="cta-arrow"></span>
    </a>
    <a href="https://www.jamestannahill.com/privacy" class="privacy-link">Privacy</a>
  </main>

  <script src="/map.js"></script>
</body>
</html>
