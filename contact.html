  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    /* Component display rules (flex, grid) must not override [hidden]. */
    [hidden] { display: none !important; }

    :root {
      --red: #e01a1a;
      --red-dark: #c01515;
      --ink: #1a1a1a;
      --text: #333;
      --muted: #6b6b6b;
      --rule: #e0e0e0;
      --bg: #fdfdfc;
      --on-ink: #f5f5f3;
      --bg-lift: #f8f8f8;
      /* Pressed state: visibly darker than white on a bright phone screen. */
      --bg-press: #ececec;
      --mono: 'JetBrains Mono', monospace;
    }

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; color-scheme: light; }
    @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

    body {
      background: var(--bg);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: var(--mono);
      -webkit-font-smoothing: antialiased;
      color: var(--ink);
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* ── TOPBAR ── */
    .bb-topbar {
      background: var(--ink);
      border-bottom: 2px solid var(--red);
      min-height: 44px;
      display: flex;
      align-items: center;
      padding: env(safe-area-inset-top, 0) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .bb-topbar-inner {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 44px;
      padding: 0 4px;
      gap: 12px;
    }
    .bb-topbar-qr {
      flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-width: 44px; min-height: 44px; margin: 0 -8px 0 auto; padding: 0 8px;
      background: none; border: 0; color: var(--on-ink); cursor: pointer;
      font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.12em;
      -webkit-tap-highlight-color: transparent;
    }
    .bb-topbar-qr svg { width: 16px; height: 16px; }
    .bb-topbar-qr:active { color: var(--red); }

    /* ── PAGE ── */
    /* The page fills the screen so the footer sits at the bottom. */
    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 0 env(safe-area-inset-bottom, 0px);
    }

    /* ── HERO ── */
    .hero {
      padding: 28px 20px 24px;
      border-bottom: 1px solid var(--rule);
    }
    .hero-eyebrow {
      font-size: 10px;
      font-weight: 700;
      color: var(--red);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .hero-eyebrow span { display: block; }
    .hero-name {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink);
      line-height: 0.95;
    }

    /* ── LINK ROWS ── */
    .link-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 20px;
      border: none;
      border-bottom: 1px solid var(--rule);
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: var(--mono);
    }
    #links > .link-row:last-child { border-bottom: none; }
    .link-row:active { background: var(--bg-press); }
    .link-ico {
      width: 15px;
      height: 15px;
      color: #949494;
      flex-shrink: 0;
    }
    .link-lbl {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      width: 72px;
      flex-shrink: 0;
    }
    .link-val {
      font-size: 11px;
      color: var(--text);
      flex: 1;
      letter-spacing: 0.02em;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .link-val.redacted {
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .link-val.revealed { color: var(--ink); }
    .link-arr { font-size: 11px; color: var(--red); flex-shrink: 0; }
    .link-arr.dim { color: var(--muted); }
    .link-arr.dim.live { color: var(--red); }

    /* ── ACTIONS ── */
    .actions-grid {
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--rule);
    }
    .action-btn {
      background: var(--bg);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.1s;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
      text-align: left;
    }
    .action-btn:active { background: var(--bg-press); }
    .action-btn svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--muted); }
    .action-wallet {
      padding: 8px 16px;
      justify-content: center;
    }
    .action-wallet img { height: 36px; width: auto; }

    /* ── QR OVERLAY ── */
    .qr-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.23, 1, 0.32, 1);
      overscroll-behavior: contain;
    }
    .qr-overlay.active { opacity: 1; pointer-events: auto; }
    .qr-overlay canvas { display: block; image-rendering: pixelated; }
    .qr-overlay-label {
      margin-top: 16px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .qr-overlay-close {
      margin-top: 18px;
      padding: 10px 18px;
      min-height: 44px;
      border: 1px solid var(--ink);
      background: var(--bg);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      cursor: pointer;
    }
    .qr-overlay-close:focus-visible { outline-offset: 3px; }
    .hint-fine { display: none; }
    @media (hover: hover) and (pointer: fine) {
      .hint-touch { display: none; }
      .hint-fine { display: inline; }
    }
    .qr-overlay-hint {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    /* ── FOOTER ── */
    .footer {
      margin-top: auto;
      padding: 16px 20px;
      border-top: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-link {
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.06em;
      display: inline-flex;
      align-items: center;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: max(28px, env(safe-area-inset-bottom, 28px));
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--ink);
      border-top: 2px solid var(--red);
      padding: 10px 20px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--on-ink);
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 300;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── SCROLL REVEAL ── */
    @media (scripting: enabled) and (prefers-reduced-motion: no-preference) {
      .sr { opacity: 0; transform: translateY(8px); transition: opacity 280ms cubic-bezier(0.23, 1, 0.32, 1), transform 280ms cubic-bezier(0.23, 1, 0.32, 1); }
      .sr.visible { opacity: 1; transform: translateY(0); }
    }
    @media print {
      .sr { opacity: 1 !important; transform: none !important; transition: none !important; }
    }

    /* ── MOBILE ── */
    @media (max-width: 480px) {
      .hero { padding: 22px 16px 18px; }
      .hero-eyebrow { letter-spacing: 0.12em; }
      .hero-name { font-size: clamp(30px, 9vw, 34px); }
      .link-row { padding: 13px 16px; }
      .link-lbl { width: 70px; }
      .action-btn { padding: 14px 16px; }
      .footer { padding: 14px 16px; flex-wrap: wrap; gap: 8px 12px; }
      .toast { max-width: calc(100vw - 32px); white-space: normal; text-align: center; }
    }

    /* Touch sizing follows the input, not the width: landscape phones and
       tablets get the same targets as a portrait phone. */
    @media (pointer: coarse) {
      .link-row, .action-btn { min-height: 48px; }
      .footer-link { min-height: 44px; }
    }

    @media (max-width: 360px) {
      .link-lbl { width: 62px; letter-spacing: 0.04em; }
    }

    @media (hover: hover) and (pointer: fine) {
      .link-row:hover { background: var(--bg-lift); }
      .action-btn:hover { background: var(--bg-lift); }
      .bb-topbar-qr:hover { color: var(--red); }
      .footer-link:hover { color: var(--ink); }
    }
    .actions-grid > :last-child:nth-child(odd) { grid-column: 1 / -1; }

    /* ── VIEW TRANSITIONS ── */
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: 180ms ease both fade-out; }
    ::view-transition-new(root) { animation: 260ms ease both fade-in; }
    @keyframes fade-out { to { opacity: 0; } }
    @keyframes fade-in { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .sr { opacity: 1 !important; transform: none !important; }
      .toast { transform: translateX(-50%) !important; transition: opacity 0.2s; }
      ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; }
    }

    :focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
      z-index: 500;
      padding: 10px 16px;
      background: var(--ink);
      color: var(--on-ink);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-decoration: none;
      border: 2px solid var(--red);
    }
    .skip-link:focus {
      position: fixed;
      left: 12px;
      top: max(12px, env(safe-area-inset-top, 12px));
      width: auto;
      height: auto;
      overflow: visible;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
